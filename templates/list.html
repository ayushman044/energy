{% extends "base.html" %}{% from "_card.html" import card with context %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1 class="page">{{ heading }}</h1><p class="sub">{{ sub }}</p>
{% if papers %}<div class="papers">{% for p in papers %}{{ card(p) }}{% endfor %}</div>
{% else %}<p class="empty">No papers here yet.</p>{% endif %}
{% endblock %}
