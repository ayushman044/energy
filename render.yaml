services:
  - type: web
    name: energy-library
    runtime: python
    plan: starter            # persistent disks need a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - {key: SECRET_KEY, generateValue: true}
      - {key: ADMIN_USERNAME, value: admin}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: DATA_DIR, value: /var/data}
      - {key: FLASK_ENV, value: production}
    disk: {name: library-data, mountPath: /var/data, sizeGB: 5}
